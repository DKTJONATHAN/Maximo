name: Google Search Console sync

on:
  pull_request:
    paths:
      - "gsc/**"
      - "scripts/authorize_gsc.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/gsc-sync.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional start date (YYYY-MM-DD); default is latest settled 28 days
        required: false
        type: string
      end_date:
        description: Optional end date (YYYY-MM-DD); default is three days ago
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gsc-sync
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud (optional persistent archive)
        if: ${{ github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCS_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Collect Search Console data
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_START_DATE: ${{ inputs.start_date }}
          GSC_END_DATE: ${{ inputs.end_date }}
          GSC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GCS_BUCKET: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCS_BUCKET != '' && vars.GCS_BUCKET || '' }}
          GSC_QUESTION_REGEX: ${{ vars.GSC_QUESTION_REGEX }}
          GSC_MIN_IMPRESSIONS: ${{ vars.GSC_MIN_IMPRESSIONS }}
        run: python -m gsc.collector
      - name: Upload reports to GitHub Actions artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-reports-${{ github.run_id }}
          path: reports/gsc/
          if-no-files-found: warn
          retention-days: 30
