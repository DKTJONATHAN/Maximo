name: Automatic IndexNow updates

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maximo-dashboard-data
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect sitemap lastmod changes and notify IndexNow
        id: notify
        continue-on-error: true
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
        run: python scripts/auto_indexnow.py
      - name: Publish IndexNow history and lastmod state
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: record automatic IndexNow updates"
            git push
          fi
      - name: Mark failed IndexNow checks
        if: ${{ steps.notify.outcome == 'failure' }}
        run: exit 1
